version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: daymatch-postgres
    environment:
      POSTGRES_DB: daymatch
      POSTGRES_USER: daymatch_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daymatch_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daymatch_user -d daymatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - daymatch-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: daymatch-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - daymatch-network

  # NestJS Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daymatch-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: daymatch_user
      DATABASE_PASSWORD: ${DB_PASSWORD:-daymatch_secret}
      DATABASE_NAME: daymatch
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_jwt_refresh_secret_here}
      JWT_EXPIRATION: 1h
      JWT_REFRESH_EXPIRATION: 7d
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - daymatch-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  daymatch-network:
    driver: bridge
